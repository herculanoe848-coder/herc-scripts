name: Atualizar ofertas do GameRadar BR

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gameradar-deals
  cancel-in-progress: true

jobs:
  update-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Buscar preços brasileiros na Steam
        run: python gameradar/update_deals.py
      - name: Publicar catálogo atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gameradar/deals.json
          if git diff --cached --quiet; then
            echo "Nenhuma mudança no catálogo."
            exit 0
          fi
          git commit -m "Atualiza ofertas brasileiras do GameRadar"
          git push
